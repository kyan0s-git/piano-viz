# Ember Classic — the reference look: warm sparks, heavy bloom, dark field.
#
# Every setting is written out here, so this file doubles as the schema
# reference. Other Designs only list what they change. Pixel sizes are at
# 1080p and scale with the output height.

[meta]
name = "Ember Classic"
author = "piano-viz"
version = 1
description = "Warm sparks on a dark field"

# ── Background ──────────────────────────────────────────────
[background]
type = "gradient"          # solid | gradient | image
color = "#05060a"          # used by solid
angle = 90.0               # degrees; 90 runs bottom to top
radial = false
image = ""                 # used by image; relative to this file
fit = "fill"               # fill | fit | stretch
tint = "#ffffff"

[[background.stops]]
at = 0.0
color = "#0b0706"

[[background.stops]]
at = 1.0
color = "#030408"

[background.reflection]
enabled = false            # the note field mirrored below the keys
opacity = 0.25
blur = 4.0
fade = 0.7

# ── Notes ───────────────────────────────────────────────────
[notes]
corner_radius = 4.0
border_width = 1.5
border_color = "#fff2e070"
opacity = 1.0
intensity = 1.6            # HDR multiplier: above 1 blooms
gradient = "along"         # none | along | across
gradient_falloff = 0.35
margin = 1.0               # gap to the key edges
active_boost = 1.6         # brighten while sounding

[notes.color]
source = "track"           # track | channel | hand | pitch_class | fixed | velocity
palette = ["#ff7a2e", "#ffc86b", "#4fc3c0", "#e84a6f", "#8e7cff"]
velocity_brightness = 0.4
black_key_shade = 0.75     # darken notes on black keys
# split = 60               # hand split pitch; omit to detect from the music

[notes.sustain_tail]
enabled = true             # draw pedal ring time as a faint tail
opacity = 0.18

# ── Keyboard ────────────────────────────────────────────────
[keyboard]
range = "88"               # auto | 88 | 76 | 61 | 49 | "21-108"
height = 0.16              # fraction of the frame
white_key_color = "#e9e6e1"
black_key_color = "#121112"
black_width_ratio = 0.58
black_length_ratio = 0.63
separator_width = 1.0
separator_color = "#555250"

[keyboard.strike_line]
enabled = true
color = "#ff9a4a"
width = 2.0
intensity = 1.2

[keyboard.pressed]
tint_from_note = true
tint_amount = 0.85
glow_intensity = 1.8
glow_radius = 24.0
depress_pixels = 2.0

# ── Particles ───────────────────────────────────────────────
# Sparks thrown up when a note lands.
[[particles]]
enabled = true
event = "note_hit"         # note_hit | note_hold | note_release
count = 36
rate = 12.0                # used by note_hold
lifetime = 1.3
lifetime_variance = 0.4
speed = 240.0
speed_variance = 0.6
direction_degrees = 90.0
spread_degrees = 80.0
gravity = [0.0, -160.0]
drag = 1.2
size = 2.6
size_variance = 0.5
size_curve = "shrink"      # constant | shrink | grow | pulse | fade_out
opacity_curve = "fade_out"
turbulence = 26.0
color_source = "note"      # note | palette | fixed
color = "#ffb060"          # used by fixed
white_hot = 0.45
intensity = 3.0
velocity_response = 0.7

# Embers rising from a held key.
[[particles]]
enabled = true
event = "note_hold"
count = 0
rate = 10.0
lifetime = 2.2
lifetime_variance = 0.4
speed = 50.0
speed_variance = 0.5
direction_degrees = 90.0
spread_degrees = 30.0
gravity = [0.0, 50.0]
drag = 0.6
size = 1.8
size_variance = 0.5
size_curve = "shrink"
opacity_curve = "fade_out"
turbulence = 36.0
color_source = "note"
color = "#ffb060"
white_hot = 0.2
intensity = 2.2
velocity_response = 0.7

# ── Post-processing ─────────────────────────────────────────
[post.bloom]
enabled = true
threshold = 0.8
soft_knee = 0.5
intensity = 0.9
radius = 0.75              # 0 tight, 1 wide
tint = "#ffe4c8"

[post.tonemap]
operator = "agx"           # agx | aces | reinhard | none
exposure = 0.0             # stops
saturation = 1.1

[post.vignette]
enabled = true
amount = 0.35
smoothness = 0.5

[post.grain]
enabled = true
amount = 0.025

[post.chromatic_aberration]
enabled = false
amount = 0.002

# ── Camera ──────────────────────────────────────────────────
[camera]
zoom = 1.0

[camera.shake]
enabled = false
amount = 2.5
decay = 9.0
velocity_response = 1.0

[camera.drift]
enabled = false
amount = 6.0
speed = 0.08

# ── Layout ──────────────────────────────────────────────────
[layout]
lookahead = 2.6            # seconds of the future visible
direction = "down"         # down | up
